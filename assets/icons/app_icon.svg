<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="beerGradLarge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Fondo Icono Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <g transform="translate(106, 70)">
    <!-- Pin de Ubicación Gigante -->
    <path d="M 150,10 C 72,10 10,72 10,150 C 10,250 150,370 150,370 C 150,370 290,250 290,150 C 290,72 228,10 150,10 Z" fill="#F59E0B" opacity="0.15"/>
    <path d="M 150,30 C 83,30 30,83 30,150 C 30,235 150,340 150,340 C 150,340 270,235 270,150 C 270,83 217,30 150,30 Z" fill="none" stroke="#F59E0B" stroke-width="8" stroke-dasharray="12 8"/>

    <!-- Tarro de Cerveza -->
    <rect x="95" y="130" width="110" height="140" rx="16" fill="url(#beerGradLarge)"/>
    <!-- Asa del tarro -->
    <path d="M 205,150 C 240,150 245,170 245,200 C 245,230 240,250 205,250" fill="none" stroke="#F59E0B" stroke-width="18" stroke-linecap="round"/>

    <!-- Burbujas y brillo -->
    <rect x="115" y="150" width="12" height="90" rx="6" fill="#FCD34D" opacity="0.4"/>
    <rect x="143" y="150" width="12" height="90" rx="6" fill="#FCD34D" opacity="0.4"/>
    <rect x="171" y="150" width="12" height="90" rx="6" fill="#FCD34D" opacity="0.4"/>

    <!-- Espuma abundante -->
    <path d="M 85,135 C 85,115 100,105 115,115 C 125,100 150,95 165,110 C 175,100 195,100 205,115 C 220,110 230,125 225,138 Z" fill="#FFFFFF"/>
  </g>
</svg>
