name: breweries_for_the_world
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.11.1
  geolocator: ^14.1.1
  bloc_concurrency: ^0.3.0
  get_it: ^9.3.0
  mapbox_maps_flutter: ^3.0.0
  url_launcher: ^6.3.3
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  go_router: ^17.5.0
  envied: ^1.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  envied_generator: ^1.3.10
  build_runner: ^2.15.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#0F172A"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/icons/adaptive_icon_foreground.png

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
